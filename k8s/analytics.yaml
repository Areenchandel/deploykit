apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
spec:
  replicas: 2
  selector:
    matchLabels: {app: analytics}
  template:
    metadata:
      labels: {app: analytics}
    spec:
      containers:
        - name: analytics
          image: analytics:v1
          imagePullPolicy: IfNotPresent   # image is loaded into kind, don't pull from internet
          ports: [{containerPort: 8000}]
          env:
            - name: REDIS_HOST
              value: redis
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:   # "ready to take traffic?"
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:    # "still alive? if not, restart me"
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
spec:
  selector: {app: analytics}
  ports: [{port: 80, targetPort: 8000}]
